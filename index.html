<script>
(() => {
/* ---------- utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const add = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const today = () => iso(new Date());
const monday = s => { const d = parse(s); const w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return iso(d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MOIS_C = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const jour = s => JOURS[parse(s).getDay()];
const dateLong = s => { const d = parse(s); return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}`; };
const dateCourt = s => { const d = parse(s); return `${d.getDate()} ${MOIS_C[d.getMonth()]}`; };
const eur = v => (Math.round((v + 1e-9) * 100) / 100).toFixed(2).replace(".", ",") + " €";
const eur0 = v => Math.round(v).toLocaleString("fr-FR") + " €";
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const uid = () => Math.random().toString(36).slice(2, 10);

/* ---------- état ---------- */
const S = {
  ing: null, rec: null,
  plan: {},            // date -> {midi:{statut, congel?}, soir:{statut, recette, achete, congele}}
  stock: { congel: [], placard: {} },
  panier: { du: null, au: null, exclus: {}, extra: [], pris: {}, assez: {}, prix: {} },
  budget: {},          // année -> {achats:[]}
  ready: false, offline: false
};
let db = null;
const UI = { tab: "accueil", weekStart: monday(today()), coursesTri: "rayon", budgetVue: "mois", recFiltre: "Toutes", recTri: "az" };

const R = id => S.rec?.find(r => r.id === id);
const I = id => S.ing?.[id];
const planDay = d => (S.plan[d] ||= { midi: { statut: "maison" }, soir: { statut: "maison", recette: null } });
const getDay = d => S.plan[d] || { midi: { statut: "maison" }, soir: { statut: "maison", recette: null } };

/* ---------- calculs ---------- */
const unitPrice = i => i.format_prix / i.format_qte;
const coutPortion = r => r.lignes.reduce((s, l) => { const i = I(l.ing); return s + (i ? l.qte * unitPrice(i) : 0); }, 0) / 4;

const nbFroz = x => x.congele === true ? 2 : (+x.congele || 0);
const portionsMidi = m => m.portions || 2;
const portionsSoir = s => s.portions || 4;
function midiInfo(d) {
  const m = getDay(d).midi;
  if (m.recette && R(m.recette)) return { src: "cuisine", rec: R(m.recette), extra: Math.max(0, portionsMidi(m) - 2 - nbFroz(m)) };
  if (m.congel) return { src: "congel", rec: R(m.congel) };
  const prev = getDay(add(d, -1)).soir;
  const reste = portionsSoir(prev) - 2 - nbFroz(prev);
  if (prev.recette && prev.statut !== "absent" && reste > 0) return { src: "frigo", rec: R(prev.recette), reste };
  return { src: null, rec: null };
}
function soirInfo(d) {
  const day = getDay(d), s = day.soir;
  if (s.recette && R(s.recette)) return { src: "cuisine", rec: R(s.recette) };
  const mi = midiInfo(d);
  if (mi.src === "cuisine" && mi.extra > 0 && day.midi.statut !== "absent") return { src: "restes", rec: mi.rec, reste: mi.extra };
  return { src: null, rec: null };
}
function kcalJour(d) {
  const day = getDay(d); let t = 0, n = 0;
  const mi = midiInfo(d), si = soirInfo(d);
  if (day.midi.statut !== "absent") { if (mi.rec) { t += mi.rec.kcal; n++; } else if (day.midi.kcal) { t += +day.midi.kcal; n++; } }
  if (day.soir.statut !== "absent") { if (si.rec) { t += si.rec.kcal; n++; } else if (day.soir.kcal) { t += +day.soir.kcal; n++; } }
  return { t, n };
}

function fmtQ(q, u, pp) {
  const r1 = v => (Math.round(v * 10) / 10).toString().replace(".", ",");
  if (u === "g") { const s = q >= 1000 ? `${r1(q/1000)} kg` : `${Math.round(q)} g`; return pp && q >= pp * 0.75 ? `${s} · ≈ ${Math.round(q/pp)} pièce${Math.round(q/pp) > 1 ? "s" : ""}` : s; }
  if (u === "ml") return q >= 1000 ? `${r1(q/1000)} L` : q >= 100 ? `${r1(q/10)} cl` : `${Math.round(q)} ml`;
  if (u === "usage") return "";
  const n = r1(q); const plural = q > 1 && !/s$/.test(u) ? u + "s" : u;
  return `${n} ${plural}`;
}

/* liste de courses */
function coursesRange() {
  const du = S.panier.du || today(), au = S.panier.au || add(du, 6);
  return { du, au };
}
function recettesCourses() {
  const { du, au } = coursesRange(); const out = [];
  for (let d = du; d <= au; d = add(d, 1)) {
    const m = getDay(d).midi, s = getDay(d).soir;
    if (m.recette && m.statut !== "absent" && !m.achete && R(m.recette)) out.push({ key: d + "m", date: d, rec: R(m.recette), moment: "midi", scale: portionsMidi(m) / 4 });
    if (s.recette && s.statut !== "absent" && !s.achete && R(s.recette)) out.push({ key: d, date: d, rec: R(s.recette), moment: "soir", scale: portionsSoir(s) / 4 });
  }
  (S.panier.extra || []).forEach((id, k) => R(id) && out.push({ key: "x" + k + id, date: null, rec: R(id), extra: true }));
  return out;
}
function listeCourses() {
  const recs = recettesCourses().filter(x => !S.panier.exclus[x.key]);
  const need = {};
  recs.forEach(x => x.rec.lignes.forEach(l => {
    const i = I(l.ing); if (!i) return;
    if (i.stock === "À racheter quand c'est fini") return;
    (need[l.ing] ||= { id: l.ing, qte: 0, recs: new Set() }); need[l.ing].qte += l.qte * (x.scale || 1); need[l.ing].recs.add(x.rec.titre);
  }));
  Object.keys(S.stock.placard || {}).forEach(id => { if (S.stock.placard[id] && I(id)) (need[id] ||= { id, qte: I(id).format_qte, recs: new Set(["Placard"]), placard: true }); });
  const lines = Object.values(need).map(n => {
    const i = I(n.id); const packs = Math.max(1, Math.ceil(n.qte / i.format_qte - 1e-9));
    const estime = packs * i.format_prix;
    const corr = S.panier.prix[n.id];
    return { ...n, ing: i, packs, estime, prix: corr != null ? corr : estime, corrige: corr != null,
      completer: i.stock === "À compléter", assez: !!S.panier.assez[n.id], pris: !!S.panier.pris[n.id] };
  });
  return { recs, lines };
}

/* budget */
const achatsAll = () => Object.values(S.budget).flatMap(b => b.achats || []);
function facteur() {
  const lim = add(today(), -92); const a = achatsAll().filter(x => x.date >= lim && x.estime > 0);
  const e = a.reduce((s, x) => s + x.estime, 0), r = a.reduce((s, x) => s + x.total, 0);
  return e > 0 ? r / e : 1;
}
function budgetMois(y, m) {
  const pre = `${y}-${pad(m)}`; const t = today();
  const depense = achatsAll().filter(a => a.date.startsWith(pre)).reduce((s, a) => s + a.total, 0);
  let prevu = 0, nPrevu = 0;
  const fin = iso(new Date(y, m, 0));
  for (let d = t > `${pre}-01` ? t : `${pre}-01`; d <= fin; d = add(d, 1)) {
    const m = getDay(d).midi, s = getDay(d).soir;
    [[m, portionsMidi(m)], [s, portionsSoir(s)]].forEach(([x, p]) => { const r = R(x.recette); if (r && x.statut !== "absent" && !x.achete) { prevu += coutPortion(r) * p; nPrevu++; } });
  }
  return { depense, prevu: prevu * facteur(), nPrevu };
}

/* alertes */
function alertes() {
  const out = []; const t = today();
  (S.stock.congel || []).forEach(p => { const age = daysBetween(p.date, t); const r = R(p.rec);
    if (r && age >= 105) out.push({ k: "congel", txt: `${r.titre} au congélateur depuis ${Math.floor(age/30)} mois${age >= 120 ? " : à manger maintenant" : " : à manger avant le " + dateCourt(add(p.date, 120))}.` }); });
  const derniers = {}; achatsAll().forEach(a => (a.articles || []).forEach(x => { if (I(x.ing)?.frais && (!derniers[x.ing] || a.date > derniers[x.ing])) derniers[x.ing] = a.date; }));
  for (let d = t; d <= add(t, 6); d = add(d, 1)) {
    const s = getDay(d).soir; const r = R(s.recette); if (!r || !s.achete || s.statut === "absent") continue;
    r.lignes.forEach(l => { const ach = derniers[l.ing]; if (ach && daysBetween(ach, d) > 2) out.push({ k: "frais", txt: `${r.titre} (${jour(d)}) : ${I(l.ing).nom.toLowerCase()} acheté il y a ${daysBetween(ach, t)} jour${daysBetween(ach,t)>1?"s":""}, ${daysBetween(ach, d)} jours avant la cuisson.` }); });
  }
  const pl = Object.keys(S.stock.placard || {}).filter(k => S.stock.placard[k] && I(k));
  if (pl.length) out.push({ k: "placard", txt: `À racheter : ${pl.map(k => I(k).nom.toLowerCase()).join(", ")}.` });
  return out;
}

/* ---------- persistance ---------- */
const DOCS = { plan: "etat/planning", stock: "etat/stock", panier: "etat/panier" };
const pending = {}; const writing = {};
function save(key) {
  clearTimeout(pending[key]);
  pending[key] = setTimeout(() => flush(key), 500);
}
async function flush(key) {
  delete pending[key];
  if (!db) return;
  if (writing[key]) { save(key); return; }
  writing[key] = true;
  try {
    if (key === "plan") { pruneplan(); await db.doc(DOCS.plan).set({ jours: S.plan }); }
    else if (key === "stock") await db.doc(DOCS.stock).set(S.stock);
    else if (key === "panier") await db.doc(DOCS.panier).set(S.panier);
    else if (key === "ing") await db.doc("catalogue/ingredients").update({ items: S.ing, maj: today() });
    else if (key.startsWith("budget-")) await db.doc("budget/" + key.slice(7)).set(S.budget[key.slice(7)]);
  } catch (e) { toast(e?.code === "quota_exceeded" ? "Stockage plein : supprimez d'anciens achats." : "Enregistrement impossible pour l'instant, réessai…"); if (e?.code === "unavailable") save(key); }
  writing[key] = false;
}
function pruneplan() { const lim = add(today(), -120); Object.keys(S.plan).forEach(d => { if (d < lim) delete S.plan[d]; }); }

const kc = r => `<span class="kc">${r.kcal}<span class="muted small" style="font-weight:600"> kcal</span></span>`;
const persTxt = p => `${p} pers.`;
function mealTile(d, which) {

function vSemaine() {
  const ws = UI.weekStart, we = add(ws, 6), t = today();
  const days = Array.from({ length: 7 }, (_, i) => add(ws, i));

/* ---------- feuilles ---------- */
let SHEET_BACK = null, LAST_REPAS = null;
function openSheet(html, back = null) {
  const wasOpen = !!$("#sheet").innerHTML; SHEET_BACK = back;
  $("#sheet").innerHTML = `<div class="sheet-bg" data-a="close"><div class="sheet" role="dialog" aria-modal="true" data-stop>
    <div class="sheet-top">${back ? `<button class="btn text" data-a="sheetback">${svg("back",18)} Retour</button>` : "<span></span>"}<span class="grab"></span><button class="btn icon quiet" data-a="fermer" aria-label="Fermer">${svg("close",18)}</button></div>${html}</div></div>`;
  if (window.POPOTE_PWA && !wasOpen) try { history.pushState({ sheet: 1 }, ""); } catch {}
}
function closeSheet() { if (!$("#sheet").innerHTML) return; $("#sheet").innerHTML = ""; SHEET_BACK = null; if (window.POPOTE_PWA && history.state?.sheet) try { history.back(); } catch {} }
const act = (a, icon, label, sub, extra = "", primary = false) => `<button class="action ${primary ? "primary" : ""}" data-a="${a}" ${extra}><span class="ai">${svg(icon,18)}</span><span class="grow">${label}${sub ? `<span class="sub">${sub}</span>` : ""}</span></button>`;
const portSeg = (d, w, cur) => `<div class="row between" style="margin:2px 0 10px"><span class="small muted">Cuisiner pour</span><div class="seg" role="group" aria-label="Nombre de portions">${[2, 4].map(p => `<button data-a="portions" data-d="${d}" data-w="${w}" data-v="${p}" aria-pressed="${cur === p}">${p} personnes</button>`).join("")}</div></div>`;
const recHead = (r, sub) => `<div class="row" style="margin-bottom:12px">${thumb(r,52)}<div class="grow"><div style="font-weight:700">${esc(r.titre)}</div><div class="muted small">${sub}</div></div></div>`;
const congelActs = (d, src, n, verbe) => n <= 0 ? "" : act("congeler", "snow", n > 1 ? "Congeler 1 portion" : "Congeler la portion restante", n > 1 ? `L'autre reste ${verbe}` : "", `data-d="${d}" data-s="${src}" data-v="1"`) + (n > 1 ? act("congeler", "snow", "Congeler les 2 portions", "", `data-d="${d}" data-s="${src}" data-v="2"`) : "");
function sheetRepas(d, w) {
  const day = getDay(d), m = day[w];
  const seg = `<div class="seg full" role="group" aria-label="Statut du repas" style="margin:0 0 14px">${["maison","bureau","absent"].map(s => `<button data-a="setstatut" data-d="${d}" data-w="${w}" data-v="${s}" aria-pressed="${m.statut===s}">${STAT[s]}</button>`).join("")}</div>`;
  let head = "", acts = "";
  if (w === "midi") {
    const mi = midiInfo(d), r = mi.rec;
    if (mi.src === "cuisine") {
      head = recHead(r, `À cuisiner · ${r.kcal} kcal · ${eur(coutPortion(r))} / pers.`) + portSeg(d, "midi", portionsMidi(m));
      acts += act("fiche", "doc", "Voir la fiche", "", `data-id="${r.id}"`);
      if (mi.extra > 0) acts += r.congele ? congelActs(d, "midi", mi.extra, "pour ce soir") : `<p class="muted small" style="margin:8px 16px">${mi.extra} portion(s) en plus pour ce soir. Cette recette ne se congèle pas.</p>`;
      acts += act("choisirmidi", "swap", "Changer de recette", "", `data-d="${d}"`) + act("retirermidi", "trash", "Retirer la recette", "", `data-d="${d}"`);
    } else {
      head = r ? recHead(r, `${mi.src === "congel" ? "Portion du congélateur" : `Gamelle d'hier soir · ${mi.reste} portion${mi.reste > 1 ? "s" : ""}`} · ${r.kcal} kcal`) : `<p class="muted" style="margin:0 0 12px">Pas de gamelle pour ce midi.</p>`;
      if (r) acts += act("fiche", "doc", "Voir la fiche", "", `data-id="${r.id}"`);
      if (mi.src === "frigo") acts += r?.congele ? congelActs(d, "veille", mi.reste, "en gamelle") : (m.statut === "absent" ? `<p class="muted small" style="margin:8px 16px">Cette recette ne se congèle pas.</p>` : "");
      if (mi.src === "congel") acts += act("remettre", "inbox", "Remettre au congélateur", "", `data-d="${d}"`);
      if (!r && (S.stock.congel||[]).some(p => p.n > 0)) acts += act("sortir", "out", "Sortir du congélateur", "Choisir une portion", `data-d="${d}"`, true);
      acts += act("choisirmidi", "plus", "Cuisiner une recette", r ? "À la place de la gamelle" : "Pour 2 ou 4 personnes", `data-d="${d}"`, !r && !(S.stock.congel||[]).some(p => p.n > 0));
    }
  } else {
    const si = soirInfo(d), r = si.rec;
    if (si.src === "cuisine") {
      head = recHead(r, `${r.kcal} kcal · ${esc(r.temps)} · ${eur(coutPortion(r))} / pers.`) + portSeg(d, "soir", portionsSoir(m));
      acts += act("fiche", "doc", "Voir la fiche", "", `data-id="${r.id}"`)
        + act("decaler", "next", "Décaler d'un jour", "Les recettes suivantes glissent aussi", `data-d="${d}"`, m.statut === "absent")
        + act("choisir", "swap", "Changer de recette", "", `data-d="${d}"`)
        + act("retirer", "trash", "Retirer la recette", "", `data-d="${d}"`);
    } else if (si.src === "restes") {
      head = recHead(r, `Restes du midi · ${si.reste} portion${si.reste > 1 ? "s" : ""} · ${r.kcal} kcal`);
      acts += act("fiche", "doc", "Voir la fiche", "", `data-id="${r.id}"`);
      if (r.congele) acts += congelActs(d, "midi", si.reste, "pour ce soir");
      acts += act("choisir", "plus", "Cuisiner une recette", "À la place des restes", `data-d="${d}"`);
    } else {

      acts += act("choisir", "plus", "Choisir une recette", "", `data-d="${d}"`, true);
    }
  }
  LAST_REPAS = { d, w };
  openSheet(`<div class="label">${esc(cap(dateLong(d)))}</div><h2 style="margin:2px 0 12px;font-size:20px">${w === "midi" ? "Midi" : "Soir"}</h2>${head}${seg}<div class="card divide" style="overflow:hidden">${acts}</div>`);
}

  openSheet(`<div class="hero-img thumb" data-c="${esc(r.categorie)}" style="width:100%;height:auto">${r.photo ? `<img src="${esc(r.photo)}" alt="">` : esc(r.titre.charAt(0))}</div>
    <div class="label" style="margin-top:14px">${esc(catLabel(r.categorie))} · cahier p. ${esc(r.page)}</div><h2 style="font-size:22px;margin-top:2px">${esc(r.titre)}</h2><div class="muted" style="margin-top:2px">${esc(r.sous_titre || "")}</div>
    <div class="kpis" style="margin:14px 0 10px"><div class="kpi k1"><div class="label">Énergie</div><div class="v">${r.kcal}</div><div class="s">kcal / pers.</div></div><div class="kpi k3"><div class="label">Coût</div><div class="v">${eur(coutPortion(r)).replace(" €","")}</div><div class="s">€ / pers.</div></div><div class="kpi k2"><div class="label">Temps</div><div class="v">${esc(r.temps.replace(" min",""))}</div><div class="s">minutes</div></div></div>
    <div class="row wrapline" style="gap:6px;margin-bottom:16px">${tags(r)}</div>
    <section class="card pad" style="margin-bottom:12px"><div class="row between" style="margin-bottom:10px"><h3>Ingrédients</h3><span class="muted small">pour 4</span></div><div class="ings">${r.lignes.map(l => `<div>${esc(l.texte)}</div>`).join("")}</div></section>
    <section class="card pad"><h3 style="margin-bottom:12px">Préparation</h3><ol class="steps">${r.etapes.map(e => `<li><div><div style="font-weight:700">${esc(e.titre)}</div><div style="color:var(--ink-2)">${esc(e.texte)}</div></div></li>`).join("")}</ol></section>
    ${libres.length ? `<div class="section-h" style="margin-top:16px"><h3>Planifier un soir</h3></div><div class="chips" style="margin-top:6px">${libres.map(d => `<button class="chip" data-a="planifier" data-id="${r.id}" data-d="${d}">${cap(jour(d))} ${dateCourt(d)}</button>`).join("")}</div>` : ""}`, back);
}
function sheetChoisir(d, mode, back = null) {
  const used = new Set(); for (let k = -10; k <= 10; k++) { const s = getDay(add(d, k)).soir; if (s.recette && k) used.add(s.recette); }
  const list = triRecettes(S.rec);
  openSheet(`<div class="label">${mode === "extra" ? "Recette en option" : esc(cap(dateLong(d))) + (mode === "midi" ? " · midi" : " · soir")}</div><h2 style="margin:2px 0 12px;font-size:20px">Choisir une recette</h2>
    ${triSeg(`data-d="${d}" data-m="${mode || ""}"`)}
    <section class="card divide" style="overflow:hidden">${list.map(r => `<button class="pick" data-a="${mode === "extra" ? "pickextra" : mode === "midi" ? "pickmidi" : "pick"}" data-id="${r.id}" data-d="${d}">${thumb(r, 46)}<div class="grow"><div style="font-weight:700" class="clamp2">${esc(r.titre)}</div><div class="muted small num">${r.kcal} kcal · ${eur(coutPortion(r))} / pers.${used.has(r.id) ? " · déjà au planning" : ""}</div></div></button>`).join("")}</section>`, back);
}
function sheetSortir(d, back = null) {
  const congel = (S.stock.congel || []).filter(p => p.n > 0).sort((a, b) => a.date.localeCompare(b.date));
  openSheet(`<div class="label">${esc(cap(dateLong(d)))} · midi</div><h2 style="margin:2px 0 12px;font-size:20px">Sortir du congélateur</h2>
    <section class="card divide" style="overflow:hidden">${congel.map(p => { const r = R(p.rec); return `<button class="pick" data-a="pickcongel" data-id="${p.id}" data-d="${d}">${thumb(r,46)}<div class="grow"><div style="font-weight:700">${esc(r?.titre)}</div><div class="muted small">${p.n} portion(s) · congelé le ${dateCourt(p.date)}</div></div></button>`; }).join("")}</section>`, back);
}
/* ---------- actions ---------- */
function decaler(d) {
  const dates = Object.keys(S.plan).filter(x => x >= d && S.plan[x].soir?.recette).sort().reverse();
  dates.forEach(x => { const s = S.plan[x].soir; const n = planDay(add(x, 1)).soir; n.recette = s.recette; n.achete = s.achete; n.portions = s.portions; n.congele = 0; if (n.statut === "absent") n.statut = "maison"; s.recette = null; s.achete = false; delete s.portions; s.congele = 0; });
  save("plan"); toast("Recettes décalées d'un jour");
}
function remplir() {
  const t = today(), ws = UI.weekStart; const days = Array.from({ length: 7 }, (_, i) => add(ws, i)).filter(d => d >= t);
  const recent = new Set(); for (let k = -14; k <= 14; k++) { const s = getDay(add(t, k)).soir; if (s.recette) recent.add(s.recette); }
  let pool = S.rec.filter(r => !recent.has(r.id)); if (pool.length < days.length) pool = [...S.rec];
  pool = pool.map(r => ({ r, k: Math.random() })).sort((a, b) => a.k - b.k).map(x => x.r);
  let lastCat = null;
  days.forEach(d => { const s = planDay(d).soir; if (s.recette || s.statut === "absent") { lastCat = R(s.recette)?.categorie || lastCat; return; }
    let i = pool.findIndex(r => r.categorie !== lastCat); if (i < 0) i = 0; const r = pool.splice(i, 1)[0] || S.rec[0]; s.recette = r.id; lastCat = r.categorie; });
  save("plan"); toast("Semaine remplie, modifiable à tout moment");
}
async function valider() {
  const { recs, lines } = listeCourses(); const prises = lines.filter(l => l.pris && !l.assez); if (!prises.length) return;
  const d = today(), y = d.slice(0, 4);
  const achat = { id: uid(), date: d, total: +prises.reduce((s, l) => s + l.prix, 0).toFixed(2), estime: +prises.reduce((s, l) => s + l.estime, 0).toFixed(2),
    articles: prises.map(l => ({ ing: l.id, nom: l.ing.nom, packs: l.packs, prix: +l.prix.toFixed(2), corrige: l.corrige })), recettes: recs.filter(x => x.date).map(x => x.date) };
  (S.budget[y] ||= { achats: [] }).achats.push(achat);
  let ingChanged = false;
  prises.forEach(l => { if (l.corrige && l.packs) { S.ing[l.id].format_prix = +(l.prix / l.packs).toFixed(2); S.ing[l.id].source = "Réel"; S.ing[l.id].maj = today(); ingChanged = true; } if (S.stock.placard[l.id]) delete S.stock.placard[l.id]; });
  recs.forEach(x => { if (x.date) planDay(x.date)[x.moment || "soir"].achete = true; });
  S.panier = { du: null, au: null, exclus: {}, extra: [], pris: {}, assez: {}, prix: {} };
  save("budget-" + y); save("plan"); save("stock"); save("panier"); if (ingChanged) save("ing");
  toast(`Courses validées : ${eur(achat.total)}`);
}

let toastT; function toast(m) { const t = $("#toast"); t.textContent = m; t.className = "toast"; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
document.addEventListener("toggle", e => { if (e.target.id === "recs") UI.recsOpen = e.target.open; }, true);
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  if (el.dataset.a === "close" && e.target.closest("[data-stop]")) return;
  const a = el.dataset.a, d = el.dataset.d, id = el.dataset.id, v = el.dataset.v;
  const fromRepas = !!e.target.closest("#sheet") && LAST_REPAS, rp = LAST_REPAS;
  const back = fromRepas ? () => sheetRepas(rp.d, rp.w) : null;
  if (["assez","placard","incl","range","prixin"].includes(a)) return;
  switch (a) {
    case "tab": UI.tab = v; closeSheet(); LAST_REPAS = null; window.scrollTo(0, 0); break;
    case "close": case "fermer": closeSheet(); return;
    case "sheetback": { const b = SHEET_BACK; if (b) b(); else closeSheet(); return; }
    case "week": UI.weekStart = v === "0" ? monday(today()) : add(UI.weekStart, +v); break;
    case "repas": LAST_REPAS = null; sheetRepas(d, el.dataset.w); return;
    case "setstatut": { const w = el.dataset.w; planDay(d)[w].statut = v; save("plan"); render(); sheetRepas(d, w); return; }
    case "choisir": sheetChoisir(d, undefined, back); return;
    case "pick": { const s = planDay(d).soir; s.recette = id; s.achete = false; if (s.statut === "absent") s.statut = "maison"; save("plan"); closeSheet(); break; }
    case "fiche": sheetFiche(id, e.target.closest("#sheet") ? (SHEET_BACK && !LAST_REPAS ? SHEET_BACK : back) : null); return;
    case "planifier": { const s = planDay(d).soir; s.recette = id; s.achete = false; save("plan"); closeSheet(); toast(`${R(id).titre} : ${jour(d)} soir`); break; }
    case "decaler": decaler(d); closeSheet(); break;
    case "retirer": { const s = planDay(d).soir; s.recette = null; s.achete = false; save("plan"); closeSheet(); break; }
    case "remplir": remplir(); break;
    case "congeler": {
      const src = el.dataset.s === "midi" ? planDay(d).midi : planDay(add(d, -1)).soir;
      const dispo = el.dataset.s === "midi" ? midiInfo(d).extra : midiInfo(d).reste;
      const n = Math.min(+v || 1, dispo || 0); if (!n) return;
      S.stock.congel.push({ id: uid(), rec: src.recette, n, date: today() }); src.congele = nbFroz(src) + n;
      save("stock"); save("plan"); closeSheet(); toast(n > 1 ? `${n} portions au congélateur` : "1 portion au congélateur"); break; }
    case "portions": { const w = el.dataset.w; const x = planDay(d)[w]; x.portions = +v; x.congele = 0; save("plan"); render(); sheetRepas(d, w); return; }
    case "choisirmidi": sheetChoisir(d, "midi", back); return;
    case "pickmidi": { const m = planDay(d).midi; if (m.congel) { const p = S.stock.congel.find(x => x.id === m.congelId); if (p) p.n++; else S.stock.congel.push({ id: uid(), rec: m.congel, n: 1, date: today() }); delete m.congel; delete m.congelId; save("stock"); }
      m.recette = id; m.portions ||= 2; m.achete = false; m.congele = 0; if (m.statut === "absent") m.statut = "maison"; save("plan"); closeSheet(); toast(`${R(id).titre} : ${jour(d)} midi`); break; }
    case "retirermidi": { const m = planDay(d).midi; delete m.recette; delete m.portions; m.achete = false; m.congele = 0; save("plan"); closeSheet(); break; }
    case "sortir": sheetSortir(d, back); return;
    case "pickcongel": { const p = S.stock.congel.find(x => x.id === id); if (!p || p.n < 1) return; p.n--; const m = planDay(d).midi; m.congel = p.rec; m.congelId = p.id; S.stock.congel = S.stock.congel.filter(x => x.n > 0 || x.id === id); save("stock"); save("plan"); closeSheet(); toast("Portion sortie du congélateur"); break; }
    case "remettre": { const m = planDay(d).midi; const p = S.stock.congel.find(x => x.id === m.congelId); if (p) p.n++; else S.stock.congel.push({ id: uid(), rec: m.congel, n: 1, date: today() }); delete m.congel; delete m.congelId; save("stock"); save("plan"); closeSheet(); break; }
    case "jeter": { const p = S.stock.congel.find(x => x.id === id); if (p) { p.n--; S.stock.congel = S.stock.congel.filter(x => x.n > 0); save("stock"); } break; }
    case "filtre": UI.recFiltre = v; break;
    case "rectri": UI.recTri = v; if (el.dataset.d) { sheetChoisir(el.dataset.d, el.dataset.m || undefined, SHEET_BACK); render(); return; } break;
    case "tri": UI.coursesTri = v; break;
    case "pris": { S.panier.pris[id] = !S.panier.pris[id]; save("panier"); break; }
    case "prix": { UI.editPrix = id; render(); const inp = $("#prix-" + id); inp?.focus(); inp?.select(); return; }
    case "addextra": sheetChoisir(today(), "extra"); return;
    case "pickextra": (S.panier.extra ||= []).push(id); save("panier"); closeSheet(); break;
    case "rmextra": { e.preventDefault(); const k = S.panier.extra.findIndex((x, i) => "x" + i + x === v); if (k >= 0) S.panier.extra.splice(k, 1); save("panier"); break; }
    case "valider": valider(); break;
    case "bvue": UI.budgetVue = v; break;
    case "export": window.popoteExport?.(); return;
    default: return;
  }
  render();
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-a]"); if (!el) return; const a = el.dataset.a, id = el.dataset.id, v = el.dataset.v;
  if (a === "assez") { S.panier.assez[id] = el.checked; if (el.checked) delete S.panier.pris[id]; save("panier"); }
  else if (a === "placard") { if (el.checked) S.stock.placard[id] = true; else delete S.stock.placard[id]; save("stock"); }
  else if (a === "incl") { if (el.checked) delete S.panier.exclus[v]; else S.panier.exclus[v] = true; save("panier"); }
  else if (a === "import") { const f = el.files?.[0]; if (f) window.popoteImport?.(f); return; }
  else if (a === "range") { if (el.value) { S.panier[v] = el.value; if (v === "du" && (S.panier.au || "") < el.value) S.panier.au = add(el.value, 6); save("panier"); } }
  else return;
  render();
});
function commitPrix(el) {
  const id = el.dataset.id; if (UI.editPrix !== id) return; UI.editPrix = null;
  const n = parseFloat(String(el.value).replace(",", ".").replace(/[^\d.]/g, ""));
  const l = listeCourses().lines.find(x => x.id === id);
  if (!isNaN(n) && l && Math.abs(n - l.estime) > 0.004) S.panier.prix[id] = n; else delete S.panier.prix[id];
  save("panier"); render();
}
document.addEventListener("keydown", e => { if (e.target.dataset?.a === "prixin" && e.key === "Enter") commitPrix(e.target); if (e.key === "Escape") closeSheet(); });
document.addEventListener("focusout", e => { if (e.target.dataset?.a === "prixin") commitPrix(e.target); });

/* ---------- rendu ---------- */
function render() {
  renderTabs();
  const app = $("#app");
  if (!S.ready) {
    app.innerHTML = `<div class="wrap">${appbar("Rataplan", S.offline ? "Données indisponibles" : "Chargement…")}<p class="muted">${S.offline ? (window.POPOTE_PWA ? "Connectez-vous à internet pour le premier chargement des recettes." : "L'application doit être ouverte depuis Claude, connecté, pour lire vos recettes et votre planning.") : "Récupération de vos recettes et de votre planning."}</p></div>`;
    return;
  }
  const v = { accueil: vAccueil, semaine: vSemaine, recettes: vRecettes, courses: vCourses, stock: vStock, budget: vBudget }[UI.tab];
  app.innerHTML = `<div class="wrap ${UI.tab === "courses" ? "has-foot" : ""}">${v()}</div>`;
}
/* ---------- stockage local (version installable) ---------- */
function makeLocalDB() {
  const K = p => "popote:" + p;
  const read = p => { try { const r = localStorage.getItem(K(p)); return r ? JSON.parse(r) : null; } catch { return null; } };
  const write = (p, d) => { try { localStorage.setItem(K(p), JSON.stringify(d)); } catch { throw { code: "quota_exceeded" }; } };
  let fileIng = null, fileRec = null;
  const load = (async () => {
    try { fileIng = await (await fetch("data/ingredients.json", { cache: "no-cache" })).json(); } catch {}
    try { fileRec = await (await fetch("data/recettes.json", { cache: "no-cache" })).json(); } catch {}
  })();
  const get = p => {
    if (p === "catalogue/ingredients") {
      if (!fileIng) return null;
      const items = structuredClone(fileIng.items), perso = read("prix-perso") || {};
      for (const [id, o] of Object.entries(perso)) if (items[id] && o.maj > (fileIng.maj || "")) Object.assign(items[id], { format_prix: o.format_prix, source: "Réel", maj: o.maj });
      return { ...fileIng, items };
    }
    if (p === "catalogue/recettes") return fileRec;
    return read(p);
  };
  return { doc: p => ({
    onSnapshot(next) { load.then(() => { const d = get(p); next({ exists: !!d, data: () => d }); }); return () => {}; },
    async set(d) { write(p, d); },
    async update(d) {
      if (p === "catalogue/ingredients") { const perso = read("prix-perso") || {}; for (const [id, i] of Object.entries(d.items || {})) if (i.source === "Réel" && i.maj) perso[id] = { format_prix: i.format_prix, maj: i.maj }; write("prix-perso", perso); }
      else write(p, { ...(read(p) || {}), ...d });
    }
  }) };
}
window.popoteExport = () => {
  const out = { app: "rataplan", version: 1, exporte: new Date().toISOString(), cles: {} };
  try { for (let k = 0; k < localStorage.length; k++) { const key = localStorage.key(k); if (key.startsWith("popote:")) out.cles[key] = localStorage.getItem(key); } } catch {}
  const url = URL.createObjectURL(new Blob([JSON.stringify(out)], { type: "application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = `rataplan-sauvegarde-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000); toast("Sauvegarde exportée");
};
window.popoteImport = async f => {
  try {
    const d = JSON.parse(await f.text()); if (!["popote", "rataplan"].includes(d.app) || !d.cles) throw 0;
    Object.entries(d.cles).forEach(([k, v]) => k.startsWith("popote:") && localStorage.setItem(k, v));
    toast("Sauvegarde importée"); setTimeout(() => location.reload(), 600);
  } catch { toast("Ce fichier n'est pas une sauvegarde Rataplan."); }
};

/* ---------- démarrage ---------- */
async function start() {
  render();
  db = makeLocalDB();
  const y = String(new Date().getFullYear());
  let got = { ing: false, rec: false };
  const on = (path, fn) => db.doc(path).onSnapshot(s => { fn(s.exists ? s.data() : null); render(); });
  on("catalogue/ingredients", d => { S.ing = d ? structuredClone(d.items) : {}; got.ing = true; S.ready = got.ing && got.rec; S.offline = !d; });
  on("catalogue/recettes", d => { S.rec = d ? structuredClone(d.items).sort((a,b)=>a.num-b.num) : []; got.rec = true; S.ready = got.ing && got.rec && S.rec.length > 0; S.offline = !d; });
  on(DOCS.plan, d => { S.plan = d ? structuredClone(d.jours || {}) : {}; });
  on(DOCS.stock, d => { S.stock = d ? { congel: [], placard: {}, ...structuredClone(d) } : { congel: [], placard: {} }; });
  on(DOCS.panier, d => { if (d) S.panier = { exclus: {}, extra: [], pris: {}, assez: {}, prix: {}, ...structuredClone(d) }; });
  [String(+y - 1), y].forEach(yy => on("budget/" + yy, d => { S.budget[yy] = d ? structuredClone(d) : { achats: [] }; }));
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
}
window.addEventListener("popstate", () => { if ($("#sheet").innerHTML) { $("#sheet").innerHTML = ""; SHEET_BACK = null; } });
window.POPOTE_PWA = true;
start();
})();
</script></body></html>
